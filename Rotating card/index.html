<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rotating Card</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Card Container */
        .card_container {
            width: 350px;
            height: 250px;
            margin: 100px auto;
            perspective: 1000px;
        }

        /* Card */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease-in-out;
        }

        /* Rotate Card */
        .card_container:hover .card {
            transform: rotateY(180deg);
        }

        /* Front and Back Card */
        .frontcard,
        .backcard {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;

            backface-visibility: hidden;

            border-radius: 15px;

            box-sizing: border-box;
        }

        /* Front Card */
        .frontcard {
            background-color: white;
            border: 2px solid #ddd;

            display: flex;
            justify-content: center;
            align-items: center;

            transform: rotateY(0deg);
        }

        /* Google Logo */
        .frontcard img {
            width: 200px;
            max-width: 80%;
        }

        /* Back Card */
        .backcard {
            background: radial-gradient(
                circle,
                #ff1764 0%,
                #94bbe9 100%
            );

            transform: rotateY(180deg);
        }

        /* Back Content */
        .backcard_content {
            background-color: black;
            color: white;

            border-radius: 15px;

            padding: 25px;

            height: 100%;

            box-sizing: border-box;
        }

        /* Name */
        .name {
            font-size: 25px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            color: cyan;
            margin-bottom: 10px;
        }

        /* Title */
        .title {
            font-size: 20px;
            margin: 10px 0;
        }

        /* Description */
        .description {
          background: #5f149c;
          background: linear-gradient(90deg, rgba(95, 20, 156, 1) 0%, rgba(148, 84, 84, 1) 0%, rgba(173, 103, 87, 1) 45%, rgba(252, 176, 69, 1) 100%);
          background-clip:text;
            font-size: 14px;
            color:transparent;
            line-height: 1.5;
        }

        /* Button */
        .btn {
            padding: 8px 15px;
            border: 1px solid cyan;

            background-color: white;
            color: red;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        /* Button Hover */
        .btn:hover {
            background-color: blue;
            color: white;
            border-color: cyan;
        }

    </style>
</head>

<body>

    <div class="card_container">

        <div class="card">

            <!-- FRONT CARD -->

            <div class="frontcard">

                <img
                    src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
                    alt="Google Logo"
                >

            </div>


            <!-- BACK CARD -->

            <div class="backcard">

                <div class="backcard_content">

                    <p class="name">
                        Google Website
                    </p>

                    <h2 class="title">
                        Family Learning Simply
                    </h2>

                    <p class="description">
                        Google provides many useful tools and AI features.
                        It helps people find information and learn new things.
                    </p>

                    <a
                        href="https://www.wikipedia.org/"
                        target="_blank"
                    >

                        <button class="btn">
                            Learn More
                        </button>

                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
